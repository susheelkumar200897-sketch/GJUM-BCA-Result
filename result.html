 <!DOCTYPE html>
<html>
<head>
<title>BCA Result</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>

body{
font-family: Arial;
margin:0;
background: linear-gradient(to right,#1e3c72,#2a5298);
}

.box{
width:900px;
margin:50px auto;
background:white;
padding:40px;
box-shadow:0 0 25px rgba(0,0,0,0.3);
border-radius:10px;
}

.logo{
width:100px;
margin-bottom:10px;
}

.college{
font-family: 'Playfair Display', serif;
font-size:30px;
color:#002147;
letter-spacing:1px;
margin-bottom:5px;
}

.semester{
font-size:20px;
font-weight:bold;
color:#444;
margin-bottom:20px;
}

.student-info{
background:#f4f6f9;
padding:15px;
margin:20px 0;
border-left:5px solid #002147;
font-size:18px;
}

.student-info span{
font-weight:bold;
color:#002147;
}

table{
border-collapse:collapse;
width:100%;
margin-top:15px;
}

th,td{
border:1px solid #333;
padding:10px;
text-align:center;
}

th{
background:#002147;
color:white;
}

tr:nth-child(even){
background:#f2f2f2;
}

.btn{
padding:10px 25px;
margin:15px 10px;
border:none;
background:#d19d25f7;
color:white;
cursor:pointer;
font-size:15px;
border-radius:5px;
}

.btn:hover{
background:#004080;
}

@media print{
.btn{
display:none;
}
body{
background:white;
}
}

</style>
</head>

</html>
